<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>DailyMind – Neo Brutalist Search Archive</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

/* ========================= */
/* ROOT */
/* ========================= */

:root{
  --black:#000;
  --white:#fff;
  --accent:#00ff88;
  --accent2:#ff3366;
}

body{
  font-family:'Montserrat', sans-serif;
  background:#ffffff;
  padding-top:80px;
  color:#000;
}

/* ========================= */
/* NAVBAR */
/* ========================= */

.navbar{
  background:#fff !important;
  border-bottom:4px solid #000;
}

.navbar-brand{
  font-weight:800;
  letter-spacing:2px;
  font-size:1.1rem;
  color:#000 !important;
}

/* ========================= */
/* MAIN FRAME */
/* ========================= */

main{
  max-width:1300px;
  margin:3rem auto;
  padding:3rem;
  border:4px solid #000;
  box-shadow:12px 12px 0 #000;
  background:#fff;
}

/* ========================= */
/* BRUTAL IFRAME SECTION */
/* ========================= */

.brutal-frame{
  border:4px solid #000;
  box-shadow:10px 10px 0 #000;
  padding:2rem;
  margin-bottom:3rem;
}

.brutal-title{
  font-size:1.2rem;
  font-weight:800;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:1.5rem;
}

.brutal-iframe-wrapper{
  border:4px solid #000;
  box-shadow:8px 8px 0 #000;
  overflow:hidden;
}

.brutal-iframe-wrapper iframe{
  width:100%;
  height:420px;
  border:none;
  display:block;
}

/* ========================= */
/* TABLE SYSTEM */
/* ========================= */

#archiveTable{
  border:4px solid #000;
  width:100% !important;
}

#archiveTable thead{
  background:var(--accent);
  border-bottom:4px solid #000;
}

#archiveTable th{
  border-right:3px solid #000;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:800;
}

#archiveTable th,
#archiveTable td{
  border:3px solid #000 !important;
  padding:10px;
  vertical-align:top;
}

/* ALL CELLS SCROLL */
#archiveTable th div,
#archiveTable td div{
  max-height:130px;
  overflow:auto;
  word-break:break-word;
}

/* Scrollbar Brutal */
#archiveTable div::-webkit-scrollbar{
  width:8px;
}
#archiveTable div::-webkit-scrollbar-thumb{
  background:#000;
}

/* ========================= */
/* LINKS */
/* ========================= */

a{
  color:#000;
  font-weight:600;
  text-decoration:none;
  border-bottom:3px solid #000;
}

a:hover{
  background:var(--accent2);
  color:#fff;
}

/* ========================= */
/* DATATABLE OVERRIDE */
/* ========================= */

.dataTables_wrapper{
  margin-top:2rem;
}

.dataTables_filter input{
  border:3px solid #000 !important;
  padding:6px 12px;
  box-shadow:4px 4px 0 #000;
}

.dataTables_paginate .paginate_button{
  border:3px solid #000 !important;
  box-shadow:4px 4px 0 #000;
  margin:0 4px;
}

.dataTables_paginate .current{
  background:var(--accent) !important;
  color:#000 !important;
}

</style>
</head>
<body>

<nav class="navbar fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">BANDANEE DAILYMIND</a>
  </div>
</nav>

<main>

<!-- ========================= -->
<!-- IFRAME PROMO -->
<!-- ========================= -->

<section class="brutal-frame">
  <div class="brutal-title">
    Mindfulness ACT – 8 Haftada Zihinsel Esneklik
  </div>
  <div class="brutal-iframe-wrapper">
    <iframe 
      src="https://www.udemy.com/course/mindfulness-act-8-haftada-zihinsel-esneklik-kazan/"
      loading="lazy"
      allowfullscreen>
    </iframe>
  </div>
</section>

<!-- ========================= -->
<!-- TABLE -->
<!-- ========================= -->

<table id="archiveTable">
  <thead>
    <tr>
      <th><div>Klasör</div></th>
      <th><div>Title</div></th>
      <th><div>Description</div></th>
      <th><div>Keywords</div></th>
    </tr>
  </thead>
  <tbody>
  </tbody>
</table>

</main>

<!-- ========================= -->
<!-- SCRIPTS -->
<!-- ========================= -->

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
const owner = "bandanee";
const repo = "DailyMind";
const path = "arsiv";

function extractMeta(htmlText){
  const parser = new DOMParser();
  const doc = parser.parseFromString(htmlText,"text/html");

  return {
    title: doc.querySelector("title")?.innerText || "-",
    description: doc.querySelector('meta[name="description"]')?.content || "-",
    keywords: doc.querySelector('meta[name="keywords"]')?.content || "-"
  };
}

async function fetchFolders(){
  const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`);
  const items = await res.json();
  return items.filter(item => item.type === "dir");
}

async function fetchMetaFromFolder(folderName){
  try{
    const url = `https://raw.githubusercontent.com/${owner}/${repo}/main/${path}/${folderName}/index.html`;
    const res = await fetch(url);
    if(!res.ok) throw new Error();
    const htmlText = await res.text();
    return extractMeta(htmlText);
  }catch{
    return {title:"-",description:"-",keywords:"-"};
  }
}

async function init(){
  const folders = await fetchFolders();
  const tbody = $("#archiveTable tbody");

  for(const dir of folders){
    const meta = await fetchMetaFromFolder(dir.name);

    const row = `
      <tr>
        <td><div>
          <a href="https://${owner}.github.io/${repo}/${path}/${dir.name}/index.html" target="_blank">
            ${dir.name}
          </a>
        </div></td>
        <td><div>${meta.title}</div></td>
        <td><div>${meta.description}</div></td>
        <td><div>${meta.keywords}</div></td>
      </tr>
    `;

    tbody.append(row);
  }

  $('#archiveTable').DataTable({
    pageLength:10,
    lengthMenu:[5,10,20,50],
    language:{
      search:"Ara:",
      lengthMenu:"Sayfa başına _MENU_ kayıt",
      info:"_TOTAL_ klasörden _START_ - _END_ gösteriliyor",
      paginate:{previous:"Önceki",next:"Sonraki"},
      zeroRecords:"Eşleşen kayıt bulunamadı"
    }
  });
}

init();
</script>

</body>
</html>
