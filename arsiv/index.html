<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DailyMind Arşiv - Dinamik DataTable</title>
<meta name="description" content="DailyMind arşiv klasörleri. Arama ve filtreleme ile tüm arşivleri görüntüleyin.">
<meta name="keywords" content="DailyMind, Arşiv, Klasör, GitHub, JavaScript, HTML, Dinamik Liste">
<meta name="author" content="DailyMind">

<!-- DataTables CSS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

<!-- Modern minimal style -->
<style>
  body {
    font-family: 'Inter', sans-serif;
    background: #f8fafc;
    color: #1f2937;
    margin: 0;
    padding: 20px;
  }

  header {
    text-align: center;
    margin-bottom: 30px;
  }

  header h1 {
    font-size: 2rem;
    color: #3b82f6;
    margin: 0;
  }

  header p {
    color: #6b7280;
    margin-top: 6px;
  }

  table.dataTable thead {
    background-color: #3b82f6;
    color: #fff;
  }

  table.dataTable tbody tr:hover {
    background-color: #dbeafe;
  }

  table.dataTable td a {
    color: #1d4ed8;
    text-decoration: none;
  }

  table.dataTable td a:hover {
    text-decoration: underline;
  }

  @media (max-width: 600px) {
    body {
      padding: 10px;
    }
    header h1 {
      font-size: 1.5rem;
    }
  }
</style>

</head>
<body>

<header>
  <h1>📂 DailyMind Arşiv</h1>
  <p>DataTables ile arama, filtreleme ve sıralama destekli modern liste</p>
</header>

<main>
  <table id="archiveTable" class="display" style="width:100%">
    <thead>
      <tr>
        <th>Klasör</th>
        <th>Title</th>
        <th>Description</th>
        <th>Keywords</th>
      </tr>
    </thead>
    <tbody>
      <!-- Dinamik olarak JS ile doldurulacak -->
    </tbody>
  </table>
</main>

<!-- jQuery ve DataTables JS -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
const owner = "bandanee";
const repo = "DailyMind";
const path = "arsiv";

// Örnek metadata, istersen GitHub üzerinden README.md çekip parse edebilirsin
function generateMeta(dirName) {
  return {
    title: dirName.replace(/[-_]/g, ' '),
    description: `DailyMind arşiv klasörü: ${dirName}`,
    keywords: `DailyMind, ${dirName}, Arşiv, Klasör`
  };
}

async function fetchFolders() {
  try {
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`);
    const items = await res.json();
    return items.filter(item => item.type === "dir");
  } catch(e) {
    console.error(e);
    return [];
  }
}

async function init() {
  const folders = await fetchFolders();
  const tbody = $("#archiveTable tbody");

  folders.forEach(dir => {
    const meta = generateMeta(dir.name);

    const row = `
      <tr>
        <td><a href="https://${owner}.github.io/${repo}/${path}/${dir.name}/index.html" target="_blank" rel="noopener">${dir.name}</a></td>
        <td>${meta.title}</td>
        <td>${meta.description}</td>
        <td>${meta.keywords}</td>
      </tr>
    `;
    tbody.append(row);
  });

  $('#archiveTable').DataTable({
    responsive: true,
    pageLength: 10,
    lengthMenu: [5,10,20,50],
    language: {
      search: "Ara:",
      lengthMenu: "Sayfa başına _MENU_ kayıt",
      info: "_TOTAL_ klasörden _START_ - _END_ gösteriliyor",
      paginate: {
        previous: "Önceki",
        next: "Sonraki"
      },
      zeroRecords: "Eşleşen kayıt bulunamadı"
    }
  });
}

init();
</script>

</body>
</html>
