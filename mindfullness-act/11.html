<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11. Gün – Mini Farkındalık Egzersizi</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f3f8f6;
    margin:0;
    padding:20px;
}
.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
}
h1{
    text-align:center;
}
.section{
    margin-bottom:30px;
}
label{
    font-weight:bold;
    display:block;
    margin-top:12px;
}
textarea{
    width:100%;
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
    min-height:90px;
    resize:vertical;
}
.reminder{
    background:#eefaf4;
    padding:15px;
    border-radius:8px;
    margin-top:10px;
    font-size:14px;
}
button{
    width:100%;
    padding:15px;
    background:#2e8b57;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    margin-top:20px;
}
button:hover{
    background:#256f46;
}
.success{
    text-align:center;
    color:green;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="container">
<h1>11. Gün – Mini Farkındalık Egzersizi</h1>

<div class="section">
<h3>🌿 1️⃣ Duruş ve Niyet</h3>
<label>Egzersize başlamadan önce niyetim ve duruşum:</label>
<textarea id="durus_niyet"></textarea>
</div>

<div class="section">
<h3>🌬 2️⃣ Nefesi İzleme</h3>
<label>Nefesimi gözlemlerken fark ettiklerim:</label>
<textarea id="nefes_izleme"></textarea>
</div>

<div class="section">
<h3>🧠 3️⃣ Düşünceleri Gözlemleme</h3>
<label>Düşüncelerimde fark ettiğim şeyler:</label>
<textarea id="dusunce_gozlem"></textarea>
</div>

<div class="section">
<h3>💓 4️⃣ Duygularla Temas</h3>
<label>Duygularımı fark ettiğim anlar:</label>
<textarea id="duygu_temas"></textarea>
</div>

<div class="section">
<h3>🌱 5️⃣ Kapanış – Gün Sonu Yansıması</h3>
<label>Egzersiz sonrası genel farkındalığım:</label>
<textarea id="kapanis_yansima"></textarea>
</div>

<div class="section">
<h3>🔎 Hatırlatma</h3>
<div class="reminder">
Bu egzersizi gün içinde hatırlamak için kısa bir not yaz:
</div>
<textarea id="hatirlatma"></textarea>
</div>

<button onclick="kaydet()">💾 KAYDET</button>
<div class="success" id="mesaj"></div>

</div>

<script>

const alanlar = document.querySelectorAll("textarea");

// Sayfa yüklenince verileri getir
window.onload = function(){
    alanlar.forEach(alan=>{
        const kayit = localStorage.getItem("gun11_"+alan.id);
        if(kayit !== null){
            alan.value = kayit;
        }
    });
};

// Otomatik kayıt
alanlar.forEach(alan=>{
    alan.addEventListener("input", function(){
        localStorage.setItem("gun11_"+this.id, this.value);
    });
});

function kaydet(){
    alanlar.forEach(alan=>{
        localStorage.setItem("gun11_"+alan.id, alan.value);
    });
    document.getElementById("mesaj").innerText="✔ 11. Gün egzersizi kaydedildi.";
}

</script>

</body>
</html>
