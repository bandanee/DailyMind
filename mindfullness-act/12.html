<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12. Gün – Not Defteri Çalışması</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    padding: 20px;
}

.container{
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.section{
    margin-bottom:25px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:8px;
}

textarea{
    width:100%;
    min-height:90px;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    resize:vertical;
    font-size:14px;
}

button{
    background:#4CAF50;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    width:100%;
}

button:hover{
    background:#45a049;
}

.saved-msg{
    text-align:center;
    margin-top:15px;
    color:green;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h1>📘 12. Gün – Not Defteri Çalışması</h1>

<div class="section">
<label>1️⃣ Olayı Yaz (Ne Oldu?)</label>
<textarea id="olay"></textarea>
</div>

<div class="section">
<label>2️⃣ O Anda Hangi Duygular Vardı?</label>
<textarea id="duygu"></textarea>
</div>

<div class="section">
<label>3️⃣ Verdiğim Tepki Neydi?</label>
<textarea id="tepki"></textarea>
</div>

<div class="section">
<label>4️⃣ Alternatif Tepkiler</label>
<textarea id="alternatif"></textarea>
</div>

<div class="section">
<label>5️⃣ Neden Bu Tepkiyi Seçerdim?</label>
<textarea id="neden"></textarea>
</div>

<div class="section">
<label>6️⃣ Gelecek İçin Mini Plan</label>
<textarea id="plan"></textarea>
</div>

<div class="section">
<label>7️⃣ Gün Sonu Değerlendirme</label>
<textarea id="degerlendirme"></textarea>
</div>

<div class="section">
<label>🔔 Kendime Hatırlatma</label>
<textarea id="hatirlatma"></textarea>
</div>

<button onclick="kaydet()">💾 KAYDET</button>

<div class="saved-msg" id="savedMessage"></div>

</div>

<script>
const storageKey = "gun12_not_defteri";

function kaydet(){
    const data = {
        olay: document.getElementById("olay").value,
        duygu: document.getElementById("duygu").value,
        tepki: document.getElementById("tepki").value,
        alternatif: document.getElementById("alternatif").value,
        neden: document.getElementById("neden").value,
        plan: document.getElementById("plan").value,
        degerlendirme: document.getElementById("degerlendirme").value,
        hatirlatma: document.getElementById("hatirlatma").value
    };

    localStorage.setItem(storageKey, JSON.stringify(data));

    const msg = document.getElementById("savedMessage");
    msg.innerText = "✔ Kayıt başarıyla yapıldı!";
    setTimeout(()=>{ msg.innerText=""; }, 3000);
}

function yukle(){
    const savedData = localStorage.getItem(storageKey);
    if(savedData){
        const data = JSON.parse(savedData);
        document.getElementById("olay").value = data.olay || "";
        document.getElementById("duygu").value = data.duygu || "";
        document.getElementById("tepki").value = data.tepki || "";
        document.getElementById("alternatif").value = data.alternatif || "";
        document.getElementById("neden").value = data.neden || "";
        document.getElementById("plan").value = data.plan || "";
        document.getElementById("degerlendirme").value = data.degerlendirme || "";
        document.getElementById("hatirlatma").value = data.hatirlatma || "";
    }
}

window.onload = yukle;
</script>

</body>
</html>
