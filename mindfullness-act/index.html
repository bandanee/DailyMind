<html lang="tr">
<head>
<meta charset="UTF-8">

<title>8 Haftalık Mindfulness</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;700;800&family=Permanent+Marker&display=swap" rel="stylesheet">

<style>
  :root {
    --black: #0D0D0D;
    --white: #FFFBF0;
    --yellow: #FFE135;
    --pink: #FF3CAC;
    --orange: #FF6B35;
    --cyan: #00F5D4;
    --purple: #7B2FBE;
    --green: #2ECC71;
    --red: #FF1744;
    --shadow: 5px 5px 0 var(--black);
    --shadow-lg: 8px 8px 0 var(--black);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--white);
    font-family: 'Space Grotesk', sans-serif;
    color: var(--black);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── NOISE OVERLAY ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
  }

  /* ── HEADER ── */
  header {
    background: var(--yellow);
    border-bottom: 4px solid var(--black);
    padding: 24px 20px 20px;
    position: relative;
    overflow: hidden;
  }
  header::after {
    content: '🧠';
    position: absolute;
    right: -10px; top: -10px;
    font-size: 120px;
    opacity: 0.08;
    transform: rotate(-20deg);
  }

  .header-inner {
    max-width: 900px;
    margin: auto;
  }

  .badge {
    display: inline-block;
    background: var(--black);
    color: var(--yellow);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 4px 12px;
    border-radius: 2px;
    margin-bottom: 8px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.4rem, 8vw, 5rem);
    line-height: 0.95;
    color: var(--black);
    letter-spacing: 1px;
  }

  h1 span { color: var(--purple); }

  .subtitle {
    font-size: 1rem;
    font-weight: 700;
    margin-top: 10px;
    color: var(--black);
    opacity: 0.7;
  }

  /* ── WEEK SELECTOR ── */
  .week-bar {
    max-width: 900px;
    margin: 24px auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .week-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 1px;
  }

  #weekSelect {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    padding: 10px 16px;
    border: 3px solid var(--black);
    border-radius: 0;
    background: var(--cyan);
    box-shadow: var(--shadow);
    cursor: pointer;
    appearance: none;
    outline: none;
  }

  /* ── PROGRESS STRIP ── */
  .progress-strip {
    max-width: 900px;
    margin: 0 auto 20px;
    padding: 0 20px;
  }

  .progress-strip-bar {
    height: 18px;
    background: #e0e0e0;
    border: 3px solid var(--black);
    border-radius: 0;
    overflow: hidden;
  }

  .progress-strip-fill {
    height: 100%;
    background: repeating-linear-gradient(
      90deg,
      var(--pink) 0px, var(--pink) 20px,
      var(--orange) 20px, var(--orange) 40px,
      var(--cyan) 40px, var(--cyan) 60px,
      var(--purple) 60px, var(--purple) 80px
    );
    width: 0%;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .progress-text {
    font-size: 0.85rem;
    font-weight: 700;
    margin-top: 5px;
    color: var(--black);
  }

  /* ── MAIN CONTENT ── */
  #daysContainer {
    max-width: 900px;
    margin: 0 auto 40px;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* ── DAY CARD ── */
  .day-card {
    border: 4px solid var(--black);
    background: var(--white);
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.4s ease both;
  }

  @keyframes slideUp {
    from { opacity:0; transform: translateY(20px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .day-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 24px;
    border-bottom: 4px solid var(--black);
  }

  .day-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem;
    line-height: 1;
    min-width: 60px;
    color: var(--purple);
  }

  .day-title-group h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.5px;
    color: var(--black);
  }

  .day-title-group p {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--black);
    opacity: 0.55;
    margin-top: 3px;
  }

  .day-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; }

  /* ── TASKS ROW ── */
  .tasks-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .task-chip {
    background: var(--yellow);
    border: 2.5px solid var(--black);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 5px 10px;
    box-shadow: 2px 2px 0 var(--black);
  }

  /* ── SECTION ── */
  .section-block {
    border: 3px solid var(--black);
  }

  .section-title {
    background: var(--black);
    color: var(--yellow);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 2px;
    padding: 8px 16px;
  }

  .section-fields {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ── FIELDS ── */
  .field-group label {
    display: block;
    font-size: 0.82rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    color: var(--black);
  }

  .field-group input[type=number],
  .field-group textarea,
  .field-group select {
    width: 100%;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 10px 12px;
    border: 3px solid var(--black);
    border-radius: 0;
    background: #FFFBF0;
    outline: none;
    box-shadow: inset 0 0 0 0 var(--cyan);
    transition: background 0.15s, box-shadow 0.15s;
    resize: vertical;
  }

  .field-group input:focus,
  .field-group textarea:focus,
  .field-group select:focus {
    background: #E0FFF9;
    box-shadow: 3px 3px 0 var(--cyan);
  }

  .field-group textarea { min-height: 60px; }

  /* ── CHECKBOX ── */
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border: 3px solid var(--black);
    background: var(--white);
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
  }

  .checkbox-row:hover { background: var(--yellow); }

  .custom-check {
    width: 26px; height: 26px;
    border: 3px solid var(--black);
    background: white;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    font-size: 1rem;
    transition: background 0.15s;
  }

  .checkbox-row.checked .custom-check {
    background: var(--green);
  }

  .checkbox-row input { display: none; }

  .checkbox-label {
    font-size: 0.88rem;
    font-weight: 700;
  }

  /* ── SAVE BUTTON ── */
  .save-btn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 2px;
    padding: 14px 28px;
    background: var(--pink);
    color: var(--white);
    border: 4px solid var(--black);
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    align-self: flex-start;
  }

  .save-btn:hover {
    background: var(--orange);
    transform: translate(-2px,-2px);
    box-shadow: 7px 7px 0 var(--black);
  }

  .save-btn:active {
    transform: translate(3px,3px);
    box-shadow: 2px 2px 0 var(--black);
  }

  .save-btn.saved {
    background: var(--green);
  }

  /* ── SAVED STAMP ── */
  .saved-stamp {
    display: none;
    font-family: 'Permanent Marker', cursive;
    font-size: 1.6rem;
    color: var(--green);
    border: 4px solid var(--green);
    padding: 6px 14px;
    transform: rotate(-4deg);
    opacity: 0;
    transition: opacity 0.3s;
    line-height: 1;
  }

  .saved-stamp.show { display: inline-block; opacity: 1; }

  /* ── CLEAR BTN ── */
  .bottom-bar {
    max-width: 900px;
    margin: 0 auto 60px;
    padding: 0 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  #clearAllBtn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 1.5px;
    padding: 12px 22px;
    background: var(--red);
    color: white;
    border: 4px solid var(--black);
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
  }

  #clearAllBtn:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 var(--black); }
  #clearAllBtn:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 var(--black); }

  /* ── CHART ── */
  .chart-wrap {
    max-width: 900px;
    margin: 0 auto 60px;
    padding: 0 20px;
  }

  .chart-card {
    border: 4px solid var(--black);
    background: var(--white);
    box-shadow: var(--shadow-lg);
    padding: 24px;
  }

  .chart-heading {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }

  /* ── CONFETTI ── */
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity:1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity:0; }
  }

  .confetti-piece {
    position: fixed;
    width: 10px; height: 10px;
    border-radius: 2px;
    animation: confettiFall linear forwards;
    pointer-events: none;
    z-index: 99999;
  }

  /* ── MOOD METER ── */
  .mood-meter {
    display: flex;
    gap: 4px;
    margin-top: 6px;
    flex-wrap: wrap;
  }

  .mood-pip {
    width: 28px; height: 28px;
    border: 2.5px solid var(--black);
    cursor: pointer;
    transition: transform 0.1s;
    font-size: 0.9rem;
    display: grid;
    place-items: center;
    font-weight: 800;
  }

  .mood-pip:hover { transform: scale(1.15); }
  .mood-pip.selected { box-shadow: inset 0 0 0 3px var(--black); }

  /* ── RESPONSIVE ── */
  @media(max-width:600px) {
    .day-header { flex-direction: column; align-items: flex-start; gap: 8px; }
    .save-btn { width: 100%; text-align: center; }
  }
  
  /* Footer Genel Ayarlar */
/* Footer Genel Ayarlar */

footer .footer-content {

</style>

        name: "🔹 Adım 8: Kursu Tamamlama ve Kalıcı Uygulama",
        color: "#20B2AA",
        fields: [
          {
            id: "course_completion",
            type: "note",
            label: "Kursu Tamamlama",
            description: "Haftalık ve kurs özetini tamamla, güçlü yönlerini fark et, gelişim alanlarını kaydet. Zihinsel esnekliği güçlendir, motivasyonu artır, değer odaklı eylemleri sürdür, kararlı adımları planla. Günlük hayatta zihinsel esnekliği sürdürebilmek için en önemli adımı belirle, öğrenmeyi kalıcı hâle getir."

const weekMotivations = [
  "Harika başlangıç! Temeller burada 🧱",
  "Ritim geliyor! Devam et 🔥",
  "Üçüncü haftadasın – güç artıyor 💪",
  "Yarı yoldasın! Muhteşem 🎯",
  "Beşinci hafta – alışkanlık oluştu 🌱",
  "Son düz! Neredeyse bitti ⚡",
  "Yedinci hafta – tam derinlikte 🌊",
  "SON HAFTA! Tarihin yazılıyor 🏆"
];

let db;
let request = indexedDB.open("MindfulnessProgram_v3",1);
request.onupgradeneeded = e => {
  db = e.target.result;
  if(!db.objectStoreNames.contains('dailyLogs'))
    db.createObjectStore('dailyLogs',{keyPath:'weekDay'});
};
request.onsuccess = e => { db = e.target.result; populateWeeks(); };
request.onerror = e => console.error(e);

// ── WEEK SELECTOR ──
function populateWeeks(){
  let weeks = [...new Set(courseJSON.map(d=>d.week))];
  let sel = document.getElementById('weekSelect');
  sel.innerHTML = weeks.map(w=>`<option value="${w}">HAFTA ${w}</option>`).join('');
  sel.addEventListener('change', e => loadWeek(+e.target.value));
  loadWeek(1);
}

// ── LOAD WEEK ──
function loadWeek(week){
  document.getElementById('weekMotivation').textContent = weekMotivations[week-1]||'';
  let container = document.getElementById('daysContainer');
  container.innerHTML = '';
  let days = courseJSON.filter(d=>d.week===week);
  days.forEach((day,i) => {
    let card = buildDayCard(day, week, i);
    if(card) container.appendChild(card);
    loadDayValues(week, day.day, day.sections);
  });
  updateProgress();
}

// ── BUILD DAY CARD ──
function buildDayCard(day, week, idx){
  let card = document.createElement('div');
  card.className = 'day-card';
  card.style.animationDelay = (idx*0.05)+'s';

  // Header
  let hdr = document.createElement('div');
  hdr.className = 'day-header';
  const hdrColors = ['#FFE135','#FF3CAC','#00F5D4','#FF6B35','#7B2FBE','#2ECC71','#FFE135'];
  hdr.style.background = hdrColors[(day.day-1)%hdrColors.length];

  let numEl = document.createElement('div');
  numEl.className = 'day-num';
  numEl.textContent = (day.day<10?'0':'')+day.day;
  numEl.style.color = '#0D0D0D';

  let titleGroup = document.createElement('div');
  titleGroup.className = 'day-title-group';
  titleGroup.innerHTML = `<h2>${day.title}</h2><p>${(day.instructions||[]).join(' · ')}</p>`;

  let stamp = document.createElement('div');
  stamp.className = 'saved-stamp';
  stamp.id = `stamp_${week}_${day.day}`;
  stamp.textContent = '✓ Kaydedildi!';

  hdr.append(numEl, titleGroup, stamp);
  card.appendChild(hdr);

  // Body
  let body = document.createElement('div');
  body.className = 'day-body';

  // Tasks
  let tasksRow = document.createElement('div');
  tasksRow.className = 'tasks-row';
  (day.instructions||[]).forEach(t=>{
    let chip = document.createElement('div');
    chip.className='task-chip'; chip.textContent=t;
    tasksRow.appendChild(chip);
  });
  body.appendChild(tasksRow);

  // Sections
  (day.sections||[]).forEach(sec => {
    let block = document.createElement('div'); block.className='section-block';
    let title = document.createElement('div'); title.className='section-title';
    title.style.background = sec.color || '#ccc';
    title.textContent = '◆ ' + (sec.name||'Bölüm').toUpperCase();
    block.appendChild(title);

    let fields = document.createElement('div'); fields.className='section-fields';

    (sec.fields||[]).forEach(f => {
        let fg = document.createElement('div'); fg.className='field-group';
        const fid = `${week}_${day.day}_${sec.name}_${f.id}`;

        if(f.type==='checkbox'){
            let row = document.createElement('label'); row.className='checkbox-row';
            row.innerHTML = `<input type="checkbox" id="${fid}"><div class="custom-check" id="check_${fid}"></div><span class="checkbox-label">${f.label}</span>`;
            row.addEventListener('click', e=>{
                e.preventDefault();
                let inp=document.getElementById(fid);
                if(!inp) return;
                inp.checked = !inp.checked;
                row.classList.toggle('checked', inp.checked);
                let checkDiv=document.getElementById(`check_${fid}`);
                if(checkDiv) checkDiv.textContent = inp.checked?'✓':'';
            });
            fg.appendChild(row);
        } else if(f.type==='mood'){
            let lbl=document.createElement('label'); lbl.textContent=f.label; fg.appendChild(lbl);
            let hiddenInp=document.createElement('input'); hiddenInp.type='hidden'; hiddenInp.id=fid; fg.appendChild(hiddenInp);
            let meter=document.createElement('div'); meter.className='mood-meter';
            const moodColors=['#FF1744','#FF3CAC','#FF6B35','#FFB347','#FFE135','#C6E03B','#2ECC71','#00F5D4','#00BFA5','#7B2FBE'];
            for(let i=0;i<=10;i++){
                let pip=document.createElement('div'); pip.className='mood-pip'; pip.textContent=i;
                pip.style.background=i===0?'#eee':moodColors[Math.min(i-1,9)];
                pip.dataset.val=i;
                pip.addEventListener('click', ()=>{
                    meter.querySelectorAll('.mood-pip').forEach(p=>p.classList.remove('selected'));
                    pip.classList.add('selected'); hiddenInp.value=i;
                });
                meter.appendChild(pip);
            }
            fg.appendChild(meter);
        } else {
            let lbl=document.createElement('label'); lbl.setAttribute('for',fid); lbl.textContent=f.label; fg.appendChild(lbl);
            let el = null;
            if(f.type==='textarea'){ el = document.createElement('textarea'); el.id=fid; el.placeholder=f.label; }
            else if(f.type==='number'){ el = document.createElement('input'); el.type='number'; el.id=fid; el.placeholder=f.label; el.min=0; el.max=100; }
            else if(f.type==='select'){ 
                el = document.createElement('select'); el.id=fid; 
                (f.options||[]).forEach(o=>{ let opt=document.createElement('option'); opt.textContent=o; el.appendChild(opt); });
            }
            if(el) fg.appendChild(el);
        }

        fields.appendChild(fg);
    });

    block.appendChild(fields);
    body.appendChild(block);
  });

  let btnRow=document.createElement('div'); btnRow.style.display='flex'; btnRow.style.gap='16px'; btnRow.style.flexWrap='wrap';
  let saveBtn=document.createElement('button'); saveBtn.className='save-btn'; saveBtn.id=`savebtn_${week}_${day.day}`; saveBtn.textContent='💾 KAYDET';
  saveBtn.addEventListener('click',()=>saveDay(week, day.day, day.sections, saveBtn));
  btnRow.appendChild(saveBtn); body.appendChild(btnRow);

  card.appendChild(body);
  return card;
}

// ── LOAD DAY VALUES ──
function loadDayValues(week, day, sections){
  let tx=db.transaction('dailyLogs','readonly');
  let store=tx.objectStore('dailyLogs');
  let req=store.get(`${week}_${day}`);
  req.onsuccess=e=>{
    let record=e.target.result;
    if(!record) return;
    (sections||[]).forEach(sec=>{
      (sec.fields||[]).forEach(f=>{
        const fid=`${week}_${day}_${sec.name}_${f.id}`;
        if(!record[sec.name]||record[sec.name][f.id]===undefined) return;
        let val=record[sec.name][f.id];
        if(f.type==='checkbox'){
          let inp=document.getElementById(fid); let row=inp?.parentElement;
          if(inp&&val){ inp.checked=true; row.classList.add('checked'); document.getElementById(`check_${fid}`).textContent='✓'; }
        } else if(f.type==='mood'){
          let inp=document.getElementById(fid);
          if(inp){ inp.value=val; let pip=document.querySelector(`[data-val="${val}"]`); if(pip)pip.classList.add('selected'); }
        } else {
          let el=document.getElementById(fid);
          if(el) el.value=val;
        }
      });
    });
    let stamp=document.getElementById(`stamp_${week}_${day}`); if(stamp) stamp.classList.add('show');
    let btn=document.getElementById(`savebtn_${week}_${day}`); if(btn){ btn.textContent='✓ KAYDEDİLDİ'; btn.style.background='#2ECC71'; }
  };
}

// ── SAVE DAY ──
function saveDay(week, day, sections, btn){
  let record={weekDay:`${week}_${day}`}; let valid=true;
  (sections||[]).forEach(sec=>{ record[sec.name]={};
    (sec.fields||[]).forEach(f=>{
      const fid=`${week}_${day}_${sec.name}_${f.id}`;
      if(f.type==='checkbox'){ let inp=document.getElementById(fid); record[sec.name][f.id]=inp?inp.checked:false; }
      else if(f.type==='mood'){ let inp=document.getElementById(fid); if(!inp||inp.value==='') valid=false; else record[sec.name][f.id]=inp.value; }
      else { let el=document.getElementById(fid); if(!el||!el.value.trim()){ valid=false; el&&(el.style.background='#FFE0E0'); } else { record[sec.name][f.id]=el.value; el.style.background=''; } }
    });
  });
  if(!valid){ shakeBtn(btn); return; }
  let tx=db.transaction('dailyLogs','readwrite'); tx.objectStore('dailyLogs').put(record);
  tx.oncomplete=()=>{
    btn.textContent='✓ KAYDEDİLDİ'; btn.style.background='#2ECC71';
    let stamp=document.getElementById(`stamp_${week}_${day}`); if(stamp) stamp.classList.add('show');
    fireConfetti(); updateProgress();
  };
}

function shakeBtn(btn){ btn.style.animation='none'; btn.style.background='#FF1744'; setTimeout(()=>{ btn.style.background=''; btn.style.animation=''; btn.textContent='💾 KAYDET'; },800); }
function fireConfetti(){ const colors=['#FFE135','#FF3CAC','#00F5D4','#FF6B35','#7B2FBE','#2ECC71']; for(let i=0;i<30;i++){ let el=document.createElement('div'); el.className='confetti-piece'; el.style.left=Math.random()*100+'vw'; el.style.top='-20px'; el.style.background=colors[Math.floor(Math.random()*colors.length)]; el.style.animationDuration=(1+Math.random()*2)+'s'; el.style.animationDelay=(Math.random()*0.5)+'s'; el.style.transform=`rotate(${Math.random()*360}deg)`; document.body.appendChild(el); el.addEventListener('animationend',()=>el.remove()); } }

// ── PROGRESS ──
let chart;
function updateProgress(){
  let tx=db.transaction('dailyLogs','readonly'); tx.objectStore('dailyLogs').getAll().onsuccess=e=>{
    let data=e.target.result; let total=56; let done=data.length;
    document.getElementById('progressFill').style.width=Math.round(done/total*100)+'%';
    document.getElementById('progressText').textContent=`${done} / ${total} gün tamamlandı — Devam et! 🔥`;
    let weeks=[...new Set(courseJSON.map(d=>d.week))];
    let labels=weeks.map(w=>`H${w}`); let counts=weeks.map(w=>data.filter(d=>parseInt(d.weekDay.split('_')[0])===w).length);
    if(chart) chart.destroy();
    let ctx=document.getElementById('progressChart').getContext('2d');
    chart=new Chart(ctx,{
      type:'bar',
      data:{labels,datasets:[{label:'Tamamlanan Gün',data:counts,backgroundColor:['#FFE135','#FF3CAC','#00F5D4','#FF6B35','#7B2FBE','#2ECC71','#FFE135','#FF3CAC'],borderColor:'#0D0D0D',borderWidth:3}]},
      options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.raw} gün tamamlandı`}}},scales:{y:{max:7,ticks:{stepSize:1},grid:{color:'rgba(0,0,0,0.08)'}},x:{grid:{display:false}}}}
    });
  };
}

// ── CLEAR ALL ──
document.getElementById('clearAllBtn').addEventListener('click',()=>{
  if(!confirm('Tüm kayıtlar silinecek. Emin misin?')) return;
  let tx=db.transaction('dailyLogs','readwrite'); tx.objectStore('dailyLogs').clear();
  tx.oncomplete=()=>{
    document.querySelectorAll('.saved-stamp').forEach(s=>s.classList.remove('show'));
    document.querySelectorAll('.save-btn').forEach(b=>{ b.textContent='💾 KAYDET'; b.style.background=''; });
    updateProgress();
    alert('Temizlendi!');
  };
});
</script>
