<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mindfulness Günlük Formu – Gün 2</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; max-width: 800px; }
  h2 { color: #2E8B57; }
  label { display: block; margin-top: 10px; font-weight: bold; }
  input, textarea, select { width: 100%; padding: 6px; margin-top: 4px; }
  .section { border: 1px solid #ccc; padding: 15px; margin-top: 20px; border-radius: 8px; }
  button { margin-top: 15px; padding: 10px 20px; background-color: #2E8B57; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
  button:hover { background-color: #246b45; }
</style>
</head>
<body>

<h1>Mindfulness & ACT – Günlük Form: Gün 2</h1>

<form id="mindfulnessForm">

  <div class="section">
    <h2>1. Günlük Otomatik Davranışları Gözlemleme</h2>
    <label>Gün Boyunca Fark Ettiğim 3 Otomatik Davranış:</label>
    <textarea id="gunlukDavranis"></textarea>

    <label>Farkındalık Uygulaması: Nefes ve Beden Hissi:</label>
    <textarea id="farkindalikUygulama"></textarea>

    <label>Kısa Gün Sonu Yansıması / Notlar:</label>
    <textarea id="gunSonuYansima"></textarea>

    <label>5 Dakikalık Opsiyonel Nefes ve Beden Egzersizi Yaptım:</label>
    <select id="opsiyonelEgzersiz">
      <option value="">Seçiniz</option>
      <option value="Evet">Evet</option>
      <option value="Hayır">Hayır</option>
    </select>
  </div>

  <div class="section">
    <h2>2. Sabah Bölümü</h2>
    <label>Ruh Halim (0-10):</label>
    <input type="number" id="sabahRuh" min="0" max="10">
    
    <label>Günün İlk Düşüncesi:</label>
    <textarea id="sabahDusunce"></textarea>
    
    <label>Gün Boyunca Gözlemlediğim Otomatik Davranışlar:</label>
    <textarea id="sabahDavranis"></textarea>
    
    <label>Sabah Notları / Gözlemler:</label>
    <textarea id="sabahNotlar"></textarea>
  </div>

  <div class="section">
    <h2>3. Öğlen Bölümü</h2>
    <label>Öğle Farkındalık Uygulamasını Yaptım:</label>
    <textarea id="oglenFarkindalik"></textarea>
    
    <label>Bilinçli Nefes Sayısı:</label>
    <input type="number" id="oglenNefes" min="0">

    <label>Öğlen Notları / Gözlemler:</label>
    <textarea id="oglenNotlar"></textarea>
  </div>

  <div class="section">
    <h2>4. Akşam Bölümü</h2>
    <label>Gün Sonu Yansıması: Otomatik Pilot ve Bilinçli Davranışlar:</label>
    <textarea id="aksamYansima"></textarea>
    
    <label>Bunu Yargısız Gözlemledim:</label>
    <select id="aksamYargi">
      <option value="">Seçiniz</option>
      <option value="Evet">Evet</option>
      <option value="Kısmen">Kısmen</option>
      <option value="Hayır">Hayır</option>
    </select>

    <label>Duygusal Durum (0-10):</label>
    <input type="number" id="aksamDuygu" min="0" max="10">

    <label>Akşam Notları / Gözlemler:</label>
    <textarea id="aksamNotlar"></textarea>
  </div>

  <div class="section">
    <h2>5. Yatarken Bölümü</h2>
    <label>5 Dakikalık Nefes ve Beden Farkındalığı Egzersizi Yaptım:</label>
    <select id="yatarkenEgzersiz">
      <option value="">Seçiniz</option>
      <option value="Evet">Evet</option>
      <option value="Hayır">Hayır</option>
    </select>
    
    <label>Gün İçinde Fark Ettiğim Küçük Bir An:</label>
    <textarea id="yatarkenAn"></textarea>

    <label>Günün Kapanış Cümlesi / Notlar:</label>
    <textarea id="kapanis"></textarea>
  </div>

  <button type="button" onclick="kaydet()">💾 Kaydet</button>
  <button type="button" onclick="indirJSON()">📥 JSON İndir</button>
</form>

<script>
function kaydet() {
  const formData = {
    gunluk: {
      davranis: document.getElementById('gunlukDavranis').value,
      farkindalik: document.getElementById('farkindalikUygulama').value,
      yansima: document.getElementById('gunSonuYansima').value,
      opsiyonel: document.getElementById('opsiyonelEgzersiz').value
    },
    sabah: {
      ruhHali: document.getElementById('sabahRuh').value,
      dusunce: document.getElementById('sabahDusunce').value,
      davranis: document.getElementById('sabahDavranis').value,
      notlar: document.getElementById('sabahNotlar').value
    },
    oglen: {
      farkindalik: document.getElementById('oglenFarkindalik').value,
      nefesSayisi: document.getElementById('oglenNefes').value,
      notlar: document.getElementById('oglenNotlar').value
    },
    aksam: {
      yansima: document.getElementById('aksamYansima').value,
      yargi: document.getElementById('aksamYargi').value,
      duygu: document.getElementById('aksamDuygu').value,
      notlar: document.getElementById('aksamNotlar').value
    },
    yatarken: {
      egzersiz: document.getElementById('yatarkenEgzersiz').value,
      an: document.getElementById('yatarkenAn').value,
      kapanis: document.getElementById('kapanis').value
    }
  };
  
  localStorage.setItem('gun2_mindfulness', JSON.stringify(formData));
  alert('Gün 2 günlük başarıyla kaydedildi!');
}

function indirJSON() {
  const data = localStorage.getItem('gun2_mindfulness');
  if(!data) { alert('Önce kaydetmeniz gerekiyor!'); return; }
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(data);
  const dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download","gun2_mindfulness.json");
  dlAnchor.click();
}

// Sayfa yüklendiğinde varsa LocalStorage'daki veriyi doldurma
window.onload = () => {
  const data = JSON.parse(localStorage.getItem('gun2_mindfulness') || '{}');
  if(data.gunluk) {
    document.getElementById('gunlukDavranis').value = data.gunluk.davranis || '';
    document.getElementById('farkindalikUygulama').value = data.gunluk.farkindalik || '';
    document.getElementById('gunSonuYansima').value = data.gunluk.yansima || '';
    document.getElementById('opsiyonelEgzersiz').value = data.gunluk.opsiyonel || '';
  }
  if(data.sabah) {
    document.getElementById('sabahRuh').value = data.sabah.ruhHali || '';
    document.getElementById('sabahDusunce').value = data.sabah.dusunce || '';
    document.getElementById('sabahDavranis').value = data.sabah.davranis || '';
    document.getElementById('sabahNotlar').value = data.sabah.notlar || '';
  }
  if(data.oglen) {
    document.getElementById('oglenFarkindalik').value = data.oglen.farkindalik || '';
    document.getElementById('oglenNefes').value = data.oglen.nefesSayisi || '';
    document.getElementById('oglenNotlar').value = data.oglen.notlar || '';
  }
  if(data.aksam) {
    document.getElementById('aksamYansima').value = data.aksam.yansima || '';
    document.getElementById('aksamYargi').value = data.aksam.yargi || '';
    document.getElementById('aksamDuygu').value = data.aksam.duygu || '';
    document.getElementById('aksamNotlar').value = data.aksam.notlar || '';
  }
  if(data.yatarken) {
    document.getElementById('yatarkenEgzersiz').value = data.yatarken.egzersiz || '';
    document.getElementById('yatarkenAn').value = data.yatarken.an || '';
    document.getElementById('kapanis').value = data.yatarken.kapanis || '';
  }
};
</script>

</body>
</html>
