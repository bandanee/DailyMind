<style>
body { font-family:'Montserrat',sans-serif; padding-top:56px; background:#f5f5f5;}
.gallery-img { width:100%; height:auto; border-radius:6px; cursor:pointer; transition: transform 0.2s ease-in-out; }
.gallery-img:hover { transform: scale(1.05); }
.main-gallery { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1rem; }
footer { background:#343a40; color:#fff; padding:20px 0; text-align:center; margin-top:40px;}
footer a { color:#ffc107; text-decoration:none;}
footer a:hover { text-decoration:underline;}
#offcanvasLeftToggle { position:fixed; top:10px; left:10px; z-index:1080;}
#offcanvasRightToggle { position:fixed; top:10px; right:10px; z-index:1080;}
.offcanvas { overflow:auto;}
</style>

<script>
fetch("https://raw.githubusercontent.com/bandanee/root/main/import/head.html")
  .then(r => r.text())
  .then(t => document.head.insertAdjacentHTML("beforeend", t))
  .catch(e => console.error("ek_head yüklenemedi", e));
</script>
</head>

<body>

<button class="btn btn-primary" id="offcanvasLeftToggle" data-bs-toggle="offcanvas" data-bs-target="#offcanvasLeft">&#9776;</button>
<button class="btn btn-success" id="offcanvasRightToggle" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight"><i class="fas fa-comment-dots"></i></button>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">

  </div>
</nav>

<div class="offcanvas offcanvas-start" id="offcanvasLeft">
  <div id="navbar-placeholder"></div>
  <script>
    fetch('https://raw.githubusercontent.com/bandanee/root/main/import/nav.html')
      .then(r => r.text())
      .then(html => document.getElementById('navbar-placeholder').innerHTML = html)
      .catch(e => console.error(e));
  </script>
</div>

<div class="offcanvas offcanvas-end" id="offcanvasRight">
  <div id="toc-placeholder"></div>
  <script>
    fetch('https://raw.githubusercontent.com/bandanee/root/main/import/toc.html')
      .then(r => r.text())
      .then(html => document.getElementById('toc-placeholder').innerHTML = html)
      .catch(e => console.error(e));
  </script>
</div>

<div class="container my-4">
<main class="col-12 col-lg-9 mx-auto">

<h3><strong>Duygusal Farkındalık Görsel Galerisi</strong></h3>
<p>Bu sayfada duyusal farkındalıkla ilgili görselleri görebilir, zihinsel süreçlere dair infografikler ve açıklayıcı resimleri inceleyebilirsiniz. Görsele tıkladığınızda büyük hâlde açılır.</p>

<div class="main-gallery">
  <!-- Görseller buraya eklenecek; images/duygusal‑farkindalik klasöründen -->
  <img src="https://bandanee.github.io/DailyMind/images/duygusal-farkindalik/1.jpg" alt="Duygusal Farkındalık 1" class="gallery-img" data-bs-toggle="modal" data-bs-target="#imgModal" data-src="https://bandanee.github.io/DailyMind/images/duygusal-farkindalik/1.jpg">
  <img src="https://bandanee.github.io/DailyMind/images/duygusal-farkindalik/2.jpg" alt="Duygusal Farkındalık 2" class="gallery-img" data-bs-toggle="modal" data-bs-target="#imgModal" data-src="https://bandanee.github.io/DailyMind/images/duygusal-farkindalik/2.jpg">
  <img src="https://bandanee.github.io/DailyMind/images/duygusal-farkindalik/3.jpg" alt="Duygusal Farkındalık 3" class="gallery-img" data-bs-toggle="modal" data-bs-target="#imgModal" data-src="https://bandanee.github.io/DailyMind/images/duygusal-farkindalik/3.jpg">
  <!-- Yeni görseller için yukarıdaki satırları aynen kopyala ve 4.jpg, 5.jpg vb. ekle -->
</div>

<!-- Modal: Görsel Büyük Gösterim -->
<div class="modal fade" id="imgModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content bg-transparent border-0">
      <div class="modal-body p-0">
        <img src="" id="modalImage" class="w-100 rounded" alt="Büyük Görsel">
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Kapat</button>
      </div>
    </div>
  </div>
</div>

</main>
</div>

<div id="footer-placeholder"></div>
<script>
  fetch('https://raw.githubusercontent.com/bandanee/root/main/import/footer.html')
    .then(r => r.text())
    .then(html => document.getElementById('footer-placeholder').innerHTML = html)
    .catch(e => console.error(e));
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Modal için görsele tıklandığında büyük versiyonu göster
document.querySelectorAll('.gallery-img').forEach(img => {
  img.addEventListener('click', () => {
    document.getElementById('modalImage').src = img.getAttribute('data-src');
  });
});
</script>
